<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>2026简谱 - 曲谱查看器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0d0d0d;
  --bg-deep: #000000;
  --card-bg: #1c1c1c;
  --card-bg-2: #282828;
  --primary: #e0e0e0;
  --primary-light: #ffffff;
  --accent: #ffffff;
  --text: #f0f0f0;
  --text-light: #9a9a9a;
  --border: #3a3a3a;
  --shadow: rgba(0,0,0,0.5);
}

body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ===== LIST VIEW ===== */
.list-view {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

.list-header {
  text-align: center;
  padding: 40px 20px 30px;
  background: linear-gradient(135deg, #1e1e1e, #353535);
  color: #ffffff;
  border-radius: 16px;
  margin-bottom: 30px;
  position: relative;
  overflow: hidden;
}

.list-header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 30px 30px;
}

.list-header h1 {
  font-size: 2.2em;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.list-header p {
  font-size: 1em;
  opacity: 0.8;
  font-weight: 300;
}

.search-box {
  max-width: 500px;
  margin: 20px auto 0;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 12px 44px 12px 16px;
  border: 2px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  background: rgba(0,0,0,0.25);
  color: var(--text);
  font-size: 1em;
  outline: none;
  transition: all 0.3s;
}

.search-box input:focus {
  border-color: var(--accent);
  background: rgba(0,0,0,0.4);
}

.search-box input::placeholder { color: rgba(255,255,255,0.45); }

.search-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 1.2em;
}

.score-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

.score-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 10px;
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 0.95em;
  color: var(--text);
  cursor: pointer;
  transition: all 0.25s;
  text-align: center;
  line-height: 1.3;
  position: relative;
  overflow: hidden;
  min-height: 50px;
}

.score-btn::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.25s;
}

.score-btn:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--shadow);
  background: var(--card-bg-2);
}

.score-btn:hover::after { transform: scaleX(1); }

.score-btn.multi::before {
  content: '♫';
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 0.7em;
  color: var(--accent);
  opacity: 0.7;
}

.star {
  flex: 0 0 auto;
  font-size: 1.15em;
  line-height: 1;
  color: rgba(255,255,255,0.3);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: color 0.2s, transform 0.2s;
  padding: 0 2px;
}

.star:hover {
  color: #ffd24a;
  transform: scale(1.15);
}

.star.on {
  color: #ffc83d;
}

.score-btn .label {
  flex: 1;
  text-align: center;
}

.fav-toggle {
  display: inline-block;
  margin-top: 14px;
  padding: 8px 18px;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.22);
  border-radius: 20px;
  color: #f0f0f0;
  cursor: pointer;
  font-size: 0.9em;
  transition: all 0.2s;
}

.fav-toggle:hover {
  border-color: #ffd24a;
  color: #fff;
}

.fav-toggle.active {
  border-color: #ffc83d;
  color: #ffc83d;
  background: rgba(255,200,61,0.12);
}

.stats {
  text-align: center;
  padding: 20px;
  color: var(--text-light);
  font-size: 0.9em;
}

/* ===== DETAIL VIEW ===== */
.detail-view {
  display: none;
  height: 100vh;
  flex-direction: column;
  background: var(--bg);
}

.detail-view.active { display: flex; }
.list-view.hidden { display: none; }

.detail-header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  background: linear-gradient(135deg, #1e1e1e, #353535);
  color: #ffffff;
  gap: 16px;
  flex-shrink: 0;
}

.back-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #f2e9e0;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.95em;
  transition: background 0.2s;
  white-space: nowrap;
}

.back-btn:hover { background: rgba(255,255,255,0.25); }

.score-title {
  font-size: 1.4em;
  font-weight: 600;
  flex: 1;
  text-align: center;
}

.detail-body {
  flex: 1;
  display: flex;
  overflow: hidden;
  padding: 16px;
  gap: 16px;
}

/* Score display area */
.score-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--card-bg);
  border-radius: 12px;
  border: 2px solid var(--border);
}

.score-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  scroll-behavior: smooth;
  padding: 0;
  touch-action: pan-y;
}

#scorePages {
  will-change: transform;
  transform-origin: 0 0;
}

.score-scroll::-webkit-scrollbar {
  width: 8px;
}

.score-scroll::-webkit-scrollbar-track {
  background: #1c1c1c;
}

.score-scroll::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 4px;
}

.score-page {
  position: relative;
  display: block;
  width: 100%;
}

.score-page img {
  width: 100%;
  display: block;
}

.page-divider {
  text-align: center;
  padding: 10px;
  color: var(--text-light);
  font-size: 0.85em;
  border-top: 1px dashed var(--border);
  border-bottom: 1px dashed var(--border);
  background: var(--card-bg-2);
}

/* ===== Metronome ===== */
.metronome-panel {
  width: 240px;
  display: flex;
  flex-direction: column;
  background: var(--card-bg);
  border-radius: 12px;
  border: 2px solid var(--border);
  padding: 16px;
  gap: 14px;
  flex-shrink: 0;
  overflow-y: auto;
}

.metronome-title {
  text-align: center;
  font-weight: 600;
  font-size: 1.1em;
  color: var(--accent);
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}

.bpm-display {
  text-align: center;
  font-size: 2.4em;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

.bpm-label {
  text-align: center;
  font-size: 0.8em;
  color: var(--text-light);
  margin-top: 4px;
}

.bpm-slider {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: #3a3a3a;
  outline: none;
}

.bpm-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 6px var(--shadow);
}

.bpm-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.beat-type-group {
  display: flex;
  gap: 6px;
}

.beat-type-btn {
  flex: 1;
  padding: 8px 4px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg-2);
  font-size: 0.85em;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  color: var(--text);
}

.beat-type-btn.active {
  background: var(--accent);
  color: #1a1a1a;
  border-color: var(--accent);
  font-weight: 600;
}

.pendulum-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  min-height: 100px;
}

.pendulum-arm {
  width: 4px;
  height: 80px;
  background: var(--primary);
  border-radius: 2px;
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform-origin: bottom center;
  transform: translateX(-50%) rotate(0deg);
  transition: transform 0.08s linear;
}

.pendulum-ball {
  width: 24px;
  height: 24px;
  background: var(--accent);
  border-radius: 50%;
  position: absolute;
  top: -12px;
  left: -10px;
  box-shadow: 0 2px 8px var(--shadow);
}

.pendulum-pivot {
  width: 16px;
  height: 16px;
  background: var(--primary);
  border-radius: 50%;
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
}

.pendulum-base {
  width: 80px;
  height: 8px;
  background: #4a4a4a;
  border-radius: 4px;
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
}

.beat-indicator {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 8px 0;
}

.beat-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #3a3a3a;
  transition: background 0.1s;
}

.beat-dot.active {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.beat-dot.strong {
  background: var(--primary);
  box-shadow: 0 0 12px var(--primary);
}

/* Metronome toggle button */
.metro-toggle {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--accent);
  border-radius: 12px;
  background: var(--accent);
  color: #1a1a1a;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.metro-toggle:hover { background: var(--primary-light); border-color: var(--primary-light); }

.metro-toggle.running {
  background: #3a3a3a;
  border-color: #3a3a3a;
  color: #fff;
}

/* Page nav (moved into side panel) */
.page-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-top: 6px;
  border-top: 2px solid var(--border);
}

.page-nav-btn {
  padding: 8px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg-2);
  cursor: pointer;
  font-size: 0.95em;
  transition: all 0.2s;
  color: var(--text);
}

.page-nav-btn:hover { border-color: var(--primary); }

.page-info {
  font-size: 0.9em;
  color: var(--text-light);
  min-width: 44px;
  text-align: center;
}

.zoom-hint {
  text-align: center;
  font-size: 0.75em;
  color: var(--text-light);
  opacity: 0.8;
}

/* Sound control (volume + mute) */
.sound-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mute-btn {
  padding: 8px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg-2);
  color: var(--text);
  font-size: 0.85em;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  min-width: 56px;
}

.mute-btn:hover { border-color: var(--primary); }

.mute-btn.muted {
  opacity: 0.45;
  text-decoration: line-through;
  color: var(--text-light);
}

.vol-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: #3a3a3a;
  outline: none;
}

.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.vol-slider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

/* Responsive */
@media (max-width: 768px) and (orientation: portrait) {
  .score-grid {
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  .score-btn { padding: 10px 6px; font-size: 0.85em; }
  .list-header h1 { font-size: 1.6em; }
  .detail-body { flex-direction: column; }
  .metronome-panel {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 10px;
    gap: 10px;
    max-height: 38vh;
  }
  .metronome-title { width: 100%; }
  .pendulum-area { min-height: 60px; flex: 1; }
  .bpm-display { font-size: 1.8em; }
}

/* 横屏（含手机横屏）自适应：曲谱与节拍器并排 */
@media (orientation: landscape) and (max-height: 560px) {
  .detail-body { flex-direction: row; padding: 10px; gap: 10px; }
  .metronome-panel { width: 200px; padding: 10px; gap: 10px; max-height: none; }
  .pendulum-area { min-height: 70px; }
  .detail-header { padding: 8px 16px; }
  .score-title { font-size: 1.2em; }
}

@media (max-width: 480px) {
  .score-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .score-btn { padding: 8px 4px; font-size: 0.8em; min-height: 40px; }
}
</style>
</head>
<body>

<!-- ===== LIST VIEW ===== -->
<div class="list-view" id="listView">
  <div class="list-header">
    <h1>2026 简 谱</h1>
    <p>曲谱查看器 · 节拍器打拍 · 双指缩放</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索曲谱名称..." oninput="filterScores()">
      <span class="search-icon">&#128269;</span>
    </div>
    <button class="fav-toggle" id="favToggle" onclick="toggleFavOnly()">&#9734; 只看收藏</button>
  </div>
  <div class="score-grid" id="scoreGrid"></div>
  <div class="stats" id="stats"></div>
</div>

<!-- ===== DETAIL VIEW ===== -->
<div class="detail-view" id="detailView">
  <div class="detail-header">
    <button class="back-btn" onclick="goBack()">&#9664; 返回列表</button>
    <div class="score-title" id="scoreTitle"></div>
  </div>
  <div class="detail-body">
    <div class="score-area">
      <div class="score-scroll" id="scoreScroll">
        <div id="scorePages"></div>
      </div>
    </div>
    <div class="metronome-panel">
      <div class="metronome-title">&#9835; 节拍器</div>
      <div class="bpm-display" id="bpmDisplay">80</div>
      <div class="bpm-label">BPM（每分钟节拍数）</div>
      <input type="range" class="bpm-slider" id="bpmSlider" min="30" max="240" value="80" oninput="updateBPM(this.value)">
      <div class="beat-type-group">
        <button class="beat-type-btn active" data-beats="2" onclick="setBeats(2)">2/4</button>
        <button class="beat-type-btn" data-beats="3" onclick="setBeats(3)">3/4</button>
        <button class="beat-type-btn" data-beats="4" onclick="setBeats(4)">4/4</button>
        <button class="beat-type-btn" data-beats="6" onclick="setBeats(6)">6/8</button>
      </div>
      <div class="pendulum-area">
        <div class="pendulum-base"></div>
        <div class="pendulum-pivot"></div>
        <div class="pendulum-arm" id="pendulumArm">
          <div class="pendulum-ball"></div>
        </div>
      </div>
      <div class="beat-indicator" id="beatIndicator"></div>
      <button class="metro-toggle" id="metroBtn" onclick="toggleMetronome()">&#9654; 开始节拍</button>
      <div class="page-nav" id="pageNav">
        <button class="page-nav-btn" onclick="prevPage()">&#9664;</button>
        <span class="page-info" id="pageInfo">1/1</span>
        <button class="page-nav-btn" onclick="nextPage()">&#9654;</button>
      </div>
      <div class="sound-row">
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()">声音</button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80" oninput="updateVolume(this.value)">
      </div>
      <div class="zoom-hint">双指缩放 · 双击还原</div>
    </div>
  </div>
</div>

<script src="scores_data.js"></script>
<script>
// ===== State =====
let currentScore = null;
let bpm = 80;
let beats = 4;
let currentBeat = 0;
let metronomeRunning = false;
let metronomeTimer = null;
let pendulumAngle = -30;
let pendulumDir = 1;
let audioCtx = null;
let masterGain = null;
let volume = 0.8;
let muted = false;
let currentPageIndex = 0;

// ===== Favorites (星标收藏) =====
let favorites = new Set();
let showFavOnly = false;
const FAV_KEY = 'jianpu_favorites';

function loadFavorites() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (raw) JSON.parse(raw).forEach(n => favorites.add(n));
  } catch (e) {}
}

function saveFavorites() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch (e) {}
}

function toggleFavorite(name, ev) {
  if (ev) ev.stopPropagation();
  if (favorites.has(name)) favorites.delete(name);
  else favorites.add(name);
  saveFavorites();
  filterScores();
}

function toggleFavOnly() {
  showFavOnly = !showFavOnly;
  const btn = document.getElementById('favToggle');
  btn.classList.toggle('active', showFavOnly);
  btn.innerHTML = showFavOnly ? '&#9733; 显示全部' : '&#9734; 只看收藏';
  filterScores();
}

// ===== Audio Context =====
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 主音量总线：先把信号抬高，再经压缩器限幅
    // 这样外放/扬声器也能清楚听到，又不会因多分量叠加而爆音
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.8;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 24;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;
    masterGain.connect(comp).connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playClick(strong) {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  const v = volume;
  const dur = strong ? 0.12 : 0.085;

  // 木鱼声重做：把能量主体放到扬声器最敏感的中低频段，外放也能清楚听到
  // 1) 主体：三角波，落在 500~1500Hz 中频，保留木鱼“笃”的下滑感
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(strong ? 1500 : 1150, now);
  osc.frequency.exponentialRampToValueAtTime(strong ? 620 : 500, now + dur * 0.8);
  const mainPeak = (strong ? 0.95 : 0.7) * v;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(mainPeak, now + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain).connect(masterGain);
  osc.start(now);
  osc.stop(now + dur + 0.01);

  // 2) 低频体：给冲击与厚度，弱拍也加一点让它更“实”
  const body = audioCtx.createOscillator();
  const bodyGain = audioCtx.createGain();
  body.type = 'sine';
  body.frequency.setValueAtTime(strong ? 460 : 360, now);
  body.frequency.exponentialRampToValueAtTime(strong ? 210 : 170, now + dur * 1.2);
  const bodyPeak = (strong ? 0.55 : 0.33) * v;
  bodyGain.gain.setValueAtTime(0.0001, now);
  bodyGain.gain.exponentialRampToValueAtTime(bodyPeak, now + 0.002);
  bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + dur * 1.3);
  body.connect(bodyGain).connect(masterGain);
  body.start(now);
  body.stop(now + dur * 1.3 + 0.01);

  // 3) 高频亮色：保留清脆（耳机更明显），幅度压低且不冲太高频，外放不易丢失
  const harm = audioCtx.createOscillator();
  const harmGain = audioCtx.createGain();
  harm.type = 'sine';
  harm.frequency.setValueAtTime(strong ? 2800 : 2300, now);
  harm.frequency.exponentialRampToValueAtTime(strong ? 1600 : 1300, now + dur * 0.7);
  const harmPeak = (strong ? 0.28 : 0.16) * v;
  harmGain.gain.setValueAtTime(0.0001, now);
  harmGain.gain.exponentialRampToValueAtTime(harmPeak, now + 0.001);
  harmGain.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.6);
  harm.connect(harmGain).connect(masterGain);
  harm.start(now);
  harm.stop(now + dur + 0.01);
}

// ===== Sound controls =====
function updateVolume(val) {
  volume = parseInt(val) / 100;
  muted = (volume === 0);
  document.getElementById('muteBtn').classList.toggle('muted', muted);
}

function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').classList.toggle('muted', muted);
  if (!muted && audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// ===== Render List =====
function buildItem(score, origIdx) {
  const isFav = favorites.has(score.name);
  const btn = document.createElement('button');
  btn.className = 'score-btn' + (score.type === 'multi' ? ' multi' : '');
  const star = document.createElement('span');
  star.className = 'star' + (isFav ? ' on' : '');
  star.textContent = isFav ? '\u2605' : '\u2606';
  star.title = isFav ? '取消收藏' : '收藏到前面';
  star.onclick = (e) => { e.stopPropagation(); toggleFavorite(score.name, e); };
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = score.name;
  btn.appendChild(star);
  btn.appendChild(label);
  btn.onclick = () => openScore(origIdx);
  return btn;
}

function sortByFav(arr) {
  // 收藏的排前面，同类内部保持原顺序
  const fav = [], rest = [];
  arr.forEach(s => (favorites.has(s.name) ? fav : rest).push(s));
  return fav.concat(rest);
}

function renderGrid(list) {
  const grid = document.getElementById('scoreGrid');
  grid.innerHTML = '';
  sortByFav(list).forEach(score => {
    grid.appendChild(buildItem(score, SCORES.indexOf(score)));
  });
}

function renderList() {
  let list = SCORES;
  if (showFavOnly) list = list.filter(s => favorites.has(s.name));
  renderGrid(list);
  const multi = SCORES.filter(s => s.type === 'multi').length;
  let txt = `共 ${SCORES.length} 首曲谱 · ${multi} 首多页曲谱`;
  if (favorites.size) txt += ` · 已收藏 ${favorites.size} 首`;
  document.getElementById('stats').textContent = txt;
}

function filterScores() {
  const query = document.getElementById('searchInput').value.trim();
  let list = query ?
    SCORES.filter(s => s.name.toLowerCase().includes(query.toLowerCase())) :
    SCORES;
  if (showFavOnly) list = list.filter(s => favorites.has(s.name));
  renderGrid(list);
  let txt = `显示 ${list.length} / ${SCORES.length} 首`;
  if (favorites.size) txt += ` · 已收藏 ${favorites.size} 首`;
  document.getElementById('stats').textContent = txt;
}

// ===== Open Score =====
function openScore(idx) {
  currentScore = SCORES[idx];
  currentPageIndex = 0;

  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('active');
  document.getElementById('scoreTitle').textContent = currentScore.name;

  renderPages();
  updatePageNav();
  resetPosition();
  updateBeatIndicator();
}

function renderPages() {
  const container = document.getElementById('scorePages');
  container.innerHTML = '';

  currentScore.pages.forEach((pageFile, i) => {
    if (currentScore.pages.length > 1 && i > 0) {
      const divider = document.createElement('div');
      divider.className = 'page-divider';
      divider.textContent = `— 第 ${i + 1} 页 —`;
      container.appendChild(divider);
    }

    const pageDiv = document.createElement('div');
    pageDiv.className = 'score-page';
    pageDiv.dataset.page = i;

    const img = document.createElement('img');
    img.src = 'images/' + pageFile;
    img.alt = currentScore.name + ' 第' + (i+1) + '页';
    pageDiv.appendChild(img);
    container.appendChild(pageDiv);
  });
}

function updatePageNav() {
  const totalPages = currentScore.pages.length;
  document.getElementById('pageInfo').textContent =
    totalPages > 1 ? `${currentPageIndex + 1}/${totalPages}` : '1/1';
  document.getElementById('pageNav').style.display =
    totalPages > 1 ? 'flex' : 'none';
}

function prevPage() {
  if (!currentScore || currentPageIndex <= 0) return;
  currentPageIndex--;
  scrollToPage(currentPageIndex);
  updatePageNav();
}

function nextPage() {
  if (!currentScore || currentPageIndex >= currentScore.pages.length - 1) return;
  currentPageIndex++;
  scrollToPage(currentPageIndex);
  updatePageNav();
}

function scrollToPage(pageIdx) {
  const pages = document.querySelectorAll('.score-page');
  if (pages[pageIdx]) {
    pages[pageIdx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ===== Go Back =====
function goBack() {
  stopMetronome();
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.remove('active');
  currentScore = null;
}

// ===== BPM =====
function updateBPM(val) {
  bpm = parseInt(val);
  document.getElementById('bpmDisplay').textContent = bpm;

  if (metronomeRunning) {
    stopMetronome();
    startMetronome();
  }
}

// ===== Beat Type =====
function setBeats(n) {
  beats = n;
  currentBeat = 0;
  document.querySelectorAll('.beat-type-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.beats) === n);
  });
  updateBeatIndicator();
}

function updateBeatIndicator() {
  const container = document.getElementById('beatIndicator');
  container.innerHTML = '';
  for (let i = 0; i < beats; i++) {
    const dot = document.createElement('div');
    dot.className = 'beat-dot';
    container.appendChild(dot);
  }
}

// ===== Metronome =====
function toggleMetronome() {
  initAudio();
  if (metronomeRunning) {
    stopMetronome();
  } else {
    startMetronome();
  }
}

function startMetronome() {
  metronomeRunning = true;
  currentBeat = 0;
  const btn = document.getElementById('metroBtn');
  btn.innerHTML = '&#9646;&#9646; 停止节拍';
  btn.classList.add('running');
  const interval = 60000 / bpm;
  tickBeat();
  metronomeTimer = setInterval(tickBeat, interval);
}

function stopMetronome() {
  metronomeRunning = false;
  const btn = document.getElementById('metroBtn');
  btn.innerHTML = '&#9654; 开始节拍';
  btn.classList.remove('running');
  if (metronomeTimer) {
    clearInterval(metronomeTimer);
    metronomeTimer = null;
  }
}

function tickBeat() {
  const isStrong = (currentBeat % beats === 0);
  playClick(isStrong);

  const dots = document.querySelectorAll('.beat-dot');
  dots.forEach((dot) => dot.classList.remove('active', 'strong'));
  if (dots[currentBeat % beats]) {
    dots[currentBeat % beats].classList.add(currentBeat % beats === 0 ? 'strong' : 'active');
  }

  pendulumDir = pendulumDir > 0 ? -1 : 1;
  const maxAngle = 30;
  pendulumAngle = maxAngle * pendulumDir;
  document.getElementById('pendulumArm').style.transform =
    `translateX(-50%) rotate(${pendulumAngle}deg)`;

  currentBeat++;
}

function resetPosition() {
  const scrollEl = document.getElementById('scoreScroll');
  scrollEl.scrollTop = 0;
  resetZoom();
  currentBeat = 0;
  currentPageIndex = 0;
  if (currentScore) updatePageNav();
}

// ===== 曲谱图片双指缩放（始终可用）=====
let zoomScale = 1, zoomTx = 0, zoomTy = 0;
let pinchStartDist = 0, pinchStartScale = 1;
let lastSingleX = 0, lastSingleY = 0;
const scoreScrollEl = document.getElementById('scoreScroll');
const scorePagesEl = document.getElementById('scorePages');

function applyZoom() {
  scorePagesEl.style.transform = `translate(${zoomTx}px, ${zoomTy}px) scale(${zoomScale})`;
}

function resetZoom() {
  zoomScale = 1; zoomTx = 0; zoomTy = 0;
  applyZoom();
}

function getDist(t) {
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}

scoreScrollEl.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    pinchStartDist = getDist(e.touches);
    pinchStartScale = zoomScale;
  } else if (e.touches.length === 1) {
    lastSingleX = e.touches[0].clientX;
    lastSingleY = e.touches[0].clientY;
  }
}, { passive: true });

scoreScrollEl.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const s = Math.max(1, Math.min(5, pinchStartScale * (getDist(e.touches) / pinchStartDist)));
    zoomScale = s;
    applyZoom();
  } else if (e.touches.length === 1 && zoomScale > 1) {
    e.preventDefault();
    zoomTx += e.touches[0].clientX - lastSingleX;
    zoomTy += e.touches[0].clientY - lastSingleY;
    lastSingleX = e.touches[0].clientX;
    lastSingleY = e.touches[0].clientY;
    applyZoom();
  }
}, { passive: false });

scoreScrollEl.addEventListener('dblclick', resetZoom);

// ===== Init =====
loadFavorites();
renderList();

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && currentScore) {
    e.preventDefault();
    toggleMetronome();
  }
  if (e.code === 'Escape' && currentScore) {
    goBack();
  }
});
</script>
